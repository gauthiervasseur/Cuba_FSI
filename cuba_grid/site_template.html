<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuba Grid Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reader's desk. Filters and the note list on the left, the selected note on the right:
   figures first, then the note text with each figure's source sentence marked. One column on phones. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #15212c; --muted: #586572; --rule: #d6dde3;
  --accent: #b86a00; --accent-soft: #fbefd9; --hit: #ffe58a; --sel: #e6eef8; --link: #2a78d6;
  --bad: #b3362f; --bad-soft: #fbe9e7; --warn: #9a6400; --warn-soft: #fbf1dc;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161d; --surface: #17212b; --ink: #e6ecf1; --muted: #9eabb7; --rule: #2a3743;
    --accent: #e09a35; --accent-soft: #2e2414; --hit: #6b5a12; --sel: #1f3248; --link: #6aa8f0;
    --bad: #ec7d76; --bad-soft: #3a1d1b; --warn: #e0a53e; --warn-soft: #33270f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #17212b; --ink: #e6ecf1; --muted: #9eabb7; --rule: #2a3743;
  --accent: #e09a35; --accent-soft: #2e2414; --hit: #6b5a12; --sel: #1f3248; --link: #6aa8f0;
  --bad: #ec7d76; --bad-soft: #3a1d1b; --warn: #e0a53e; --warn-soft: #33270f; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); }
.muted { color: var(--muted); }
.label { font: 500 11.5px/1.3 var(--font-data); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: 360px minmax(0, 1fr); }

/* Top bar */
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--rule); background: var(--surface); }
.brand { font: 700 24px/1 var(--font-display); text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.search { flex: 1 1 320px; position: relative; min-width: 0; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 500 11px var(--font-data); color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }
.theme { display: inline-flex; border: 1px solid var(--rule); border-radius: 99px; padding: 3px; }
.theme button { font: 500 11.5px/1 var(--font-data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: none; border: 0; border-radius: 99px; padding: 7px 11px; cursor: pointer; }
.theme button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Sidebar */
.side { display: grid; grid-template-rows: auto auto minmax(0, 1fr); border-right: 1px solid var(--rule); min-height: 0; background: var(--surface); }
.filters { padding: 14px 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--rule); }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; flex: 1 1 120px; min-width: 0; }
.field input, .field select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); font-size: 14px; width: 100%; }
.years { display: flex; flex-wrap: wrap; gap: 4px; }
.years button, .sortbtn { font: 500 12px/1 var(--font-data); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); cursor: pointer; color: var(--muted); }
.years button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
.summary { padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--rule); }
.summary b { color: var(--ink); font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
.list li { border-bottom: 1px solid var(--rule); }
.list button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; padding: 9px 16px; cursor: pointer; }
.list button:hover { background: var(--bg); }
.list button[aria-current="true"] { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.list button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.li-date { font: 600 14.5px/1.3 var(--font-body); display: flex; gap: 7px; align-items: center; min-width: 0; }
.li-val { font: 500 13px/1.3 var(--font-data); text-align: right; font-variant-numeric: tabular-nums; }
.li-val small { color: var(--muted); font-size: 11px; }
.li-meta { grid-column: 1 / -1; display: flex; gap: 6px; font: 400 11.5px var(--font-data); color: var(--muted); }
.li-snip { grid-column: 1 / -1; font-size: 13px; color: var(--muted); line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
.empty { padding: 24px 16px; color: var(--muted); font-size: 14px; }

/* Detail */
.detail { overflow-y: auto; min-height: 0; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px;
  padding: 22px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
.dhead { display: grid; gap: 8px; }
.dnav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dnav button { font: 500 12px/1 var(--font-data); padding: 7px 10px; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface); cursor: pointer; }
.dnav button:disabled { opacity: .4; cursor: default; }
.back { display: none; }
h1 { font: 700 clamp(30px, 4.5vw, 44px)/1.02 var(--font-display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.dtitle { font-size: 17px; color: var(--muted); max-width: 70ch; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.badge { font: 500 11.5px/1 var(--font-data); padding: 5px 8px; border-radius: 99px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.badge.bad { color: var(--bad); border-color: currentColor; background: var(--bad-soft); }
.badge.warn { color: var(--warn); border-color: currentColor; background: var(--warn-soft); }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); overflow: hidden; }
.frame { padding: 16px 18px 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.frame + .frame { border-left: 1px solid var(--rule); }
.when { font: 600 12.5px var(--font-data); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.hero { all: unset; display: grid; gap: 2px; cursor: default; border-radius: 4px; }
.hero[data-f] { cursor: pointer; }
.hero b { font: 700 46px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.hero b small { font: 600 18px var(--font-display); color: var(--muted); margin-left: 3px; }
.hero span { font-size: 13.5px; color: var(--muted); }
.hero.na b { color: var(--muted); font-size: 34px; }
.metrics { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.m { all: unset; display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; }
.m:last-child { border-bottom: 0; }
.m[data-f] { cursor: pointer; }
.m[data-f]:hover .mk, .hero[data-f]:hover span { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); }
.m .mv { font: 500 13.5px var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.m .mk { color: var(--muted); }
.m.na .mv { color: var(--muted); }
.flagged .mv, .flagged b { color: var(--bad) !important; }
.flagged .mk::after, .hero.flagged span::after { content: " ⚠"; color: var(--bad); }
.on-field { background: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-soft); }

.causes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.causes .c { all: unset; background: var(--surface); padding: 10px 14px; display: grid; gap: 2px; }
.causes .c[data-f] { cursor: pointer; }
.causes .c b { font: 600 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.causes .c b small { font-size: 14px; color: var(--muted); margin-left: 2px; }
.causes .c span { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.causes .c.na b { color: var(--muted); }

.units { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; font-size: 14px; }
.units p { margin: 4px 0 0; }
.remark { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 14.5px; }
.remark .label { display: block; margin-bottom: 2px; }
.flags { display: grid; gap: 6px; }
.flags ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.flags li { display: flex; gap: 8px; align-items: baseline; }

.textbox { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 20px 22px; }
.texthead { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 22px; height: 10px; vertical-align: -1px; margin-right: 5px; border-radius: 2px; }
.note { white-space: pre-wrap; font-size: 16.5px; line-height: 1.65; max-width: 72ch; overflow-wrap: anywhere; }
.note .q { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: pointer; }
.note .q.on { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.note .hit { background: var(--hit); border-radius: 2px; }
.li-snip .hit { background: var(--hit); color: var(--ink); border-radius: 2px; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { background: var(--accent); color: var(--bg); } 100% { } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

/* Review desk: the form beside the note text, which stays in view while the form scrolls */
.wrap.desk-on { max-width: 1320px; }
.desk { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.desk .textbox { position: sticky; top: 12px; max-height: calc(100vh - 96px); overflow-y: auto; }
@media (max-width: 1240px) { .desk { grid-template-columns: minmax(0, 1fr); } .desk .textbox { position: static; max-height: none; } }
.rv { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.rv-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 14px; flex-wrap: wrap; }
.rv-head h2 { font: 700 24px/1 var(--font-display); text-transform: uppercase; margin: 0; }
.rv-help { font-size: 14px; color: var(--muted); margin: 0; }
.rvt-wrap { overflow-x: auto; }
.rvt { border-collapse: collapse; width: 100%; font-size: 14px; }
.rvt th { font: 500 11px/1.2 var(--font-data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 6px 6px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.rvt td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.rvt tr.grp td { font: 600 12px var(--font-data); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); padding-top: 12px; border-bottom: 0; }
.rvt tr.disputed td:first-child { box-shadow: inset 3px 0 0 var(--bad); padding-left: 8px; }
.rvt tr.err input, .rvt tr.err select { border-color: var(--bad); background: var(--bad-soft); }
.rvt .fl { all: unset; cursor: pointer; color: var(--ink); }
.rvt .fl:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.rvt .fl.noq { cursor: default; color: var(--muted); }
.rvt .fl.noq:hover { text-decoration: none; }
.rd { font: 500 12.5px var(--font-data); font-variant-numeric: tabular-nums; padding: 3px 6px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; color: var(--muted); white-space: nowrap; }
.rd:hover { border-color: var(--rule); color: var(--ink); }
.rd.diff { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.rvt input, .rvt select { width: 100%; min-width: 84px; padding: 5px 7px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); font: 500 13.5px var(--font-data); }
.rv-fields { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 10px; }
@media (max-width: 560px) { .rv-fields { grid-template-columns: minmax(0, 1fr); } }
.rv label.field textarea, .rv label.field input { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); font: 400 14.5px/1.45 var(--font-body); }
.rv textarea { min-height: 76px; resize: vertical; }
.rv-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 600 14px/1 var(--font-body); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--bad); border-color: currentColor; }
.btn:disabled { opacity: .5; cursor: progress; }
.rv-msg { font-size: 14px; margin: 0; min-height: 1.4em; }
.rv-msg.err { color: var(--bad); }
.rv-done { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; font-size: 14px; }
.hint { font-size: 14px; color: var(--muted); border: 1px dashed var(--rule); border-radius: 8px; padding: 12px 14px; }
.hint code { font-family: var(--font-data); font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; z-index: 5; max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .app[data-view="list"] .detail, .app[data-view="detail"] .side { display: none; }
  .side { border-right: 0; }
  .back { display: inline-block; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .frame + .frame { border-left: 0; border-top: 1px solid var(--rule); }
  .search kbd { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app" data-view="list">
  <header class="bar">
    <div class="brand">Cuba Grid <span>Notes</span></div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" type="search" placeholder='Search notes: Felton, avería, "sin afectación", 2024-10' aria-label="Search notes" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="theme" role="group" aria-label="Colour theme">
      <button type="button" id="theme-light" data-set="light" aria-pressed="false">Light</button>
      <button type="button" id="theme-dark" data-set="dark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <aside class="side">
    <div class="filters">
      <div class="row">
        <label class="field"><span class="label">From</span><input id="from" type="date"></label>
        <label class="field"><span class="label">To</span><input id="to" type="date"></label>
      </div>
      <div class="years" id="years" role="group" aria-label="Year"></div>
      <div class="row">
        <label class="field"><span class="label">Source</span>
          <select id="src"><option value="">All sources</option><option value="cubadebate">Cubadebate</option><option value="granma">Granma</option></select>
        </label>
        <label class="field"><span class="label">Model</span>
          <select id="model"><option value="">Any</option><option value="haiku">Haiku 5.5</option><option value="sonnet">Sonnet 5.5</option></select>
        </label>
      </div>
      <div class="row">
        <label class="field"><span class="label">Status</span>
          <select id="status">
            <option value="">All notes</option>
            <option value="review">Needs review</option>
            <option value="validated">Validated by a person</option>
            <option value="rejected">Rejected by a person</option>
            <option value="passed">Passed checks</option>
          </select>
        </label>
        <button type="button" class="sortbtn" id="sort">Newest first</button>
      </div>
    </div>
    <div class="summary" id="summary"></div>
    <ol class="list" id="list"></ol>
  </aside>

  <main class="detail" id="detail" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const NOTES = DATA.notes, HARD = DATA.hard, EDITABLE = DATA.editable;
  const byId = new Map(NOTES.map(n => [n.id, n]));
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- Theme ----------
  const root = document.documentElement, themeBtns = document.querySelectorAll(".theme button");
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const paintTheme = () => { const t = root.dataset.theme || (dark.matches ? "dark" : "light"); themeBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === t))); };
  try { const s = localStorage.getItem("cuba-grid-theme"); if (s === "light" || s === "dark") root.dataset.theme = s; } catch (e) {}
  themeBtns.forEach(b => b.addEventListener("click", () => { root.dataset.theme = b.dataset.set; try { localStorage.setItem("cuba-grid-theme", b.dataset.set); } catch (e) {} paintTheme(); }));
  dark.addEventListener("change", paintTheme); paintTheme();

  // ---------- Labels ----------
  const L = {
    prev_day_max_affectation_mw: "Max shortfall", prev_day_max_affectation_time: "Time of max", prev_day_affected_all_day: "Affected all day",
    prev_day_restored_time: "Service restored at", snapshot_time: "Snapshot time", snapshot_availability_mw: "Available",
    snapshot_demand_mw: "Demand", snapshot_affectation_mw: "Cut at snapshot", midday_forecast_affectation_mw: "Midday forecast cut",
    thermal_limitations_mw: "Thermal limitations", dg_fuel_out_plants: "DG plants out for fuel", dg_fuel_out_mw: "DG out for fuel",
    fuel_out_total_mw: "Out for fuel, total", dg_breakdown_mw: "DG broken down", dg_maintenance_mw: "DG in maintenance",
    solar_mwh: "Solar output", solar_peak_mw: "Solar peak", forecast_availability_mw: "Available", forecast_demand_mw: "Demand",
    forecast_deficit_mw: "Deficit", forecast_reserve_mw: "Reserve", forecast_affectation_mw: "Forecast cut", grid_collapse: "Grid collapse",
  };
  const FLAG = {
    quote_not_in_text: "Quote not found in the note", value_not_in_quote: "Value not in its quote", regex_disagrees: "Text patterns read a different value",
    out_of_range: "Outside the plausible range", deficit_arithmetic: "Availability − demand ≠ deficit", reserve_arithmetic: "Reserve arithmetic off",
    bad_time: "Impossible or out-of-order time", weekday_mismatch: "Weekday named does not match the date", llm_missing: "No model reading",
    source_deficit_inconsistent: "The note's own deficit sum does not add up", source_reserve_inconsistent: "The note's own reserve sum does not add up",
    quote_paraphrased: "Quote reworded (value confirmed by text patterns)", affectation_vs_deficit: "Forecast cut differs from deficit",
    snapshot_affectation_vs_gap: "Morning cut differs from demand − availability",
    human_validated: "Validated by a person; these figures replace the models'", human_rejected: "Rejected by a person; left out of daily.csv",
  };
  // Note-level flags point at the figures they involve, so the review form can mark those rows.
  const FLAG_FIELDS = {
    deficit_arithmetic: ["forecast_availability_mw", "forecast_demand_mw", "forecast_deficit_mw"],
    reserve_arithmetic: ["forecast_availability_mw", "forecast_demand_mw", "forecast_reserve_mw"],
  };
  const GROUPS = [
    ["Yesterday", ["prev_day_max_affectation_mw", "prev_day_max_affectation_time", "prev_day_affected_all_day", "prev_day_restored_time"]],
    ["This morning", ["snapshot_time", "snapshot_availability_mw", "snapshot_demand_mw", "snapshot_affectation_mw", "midday_forecast_affectation_mw"]],
    ["Tonight's peak", ["forecast_availability_mw", "forecast_demand_mw", "forecast_deficit_mw", "forecast_reserve_mw", "forecast_affectation_mw"]],
    ["Causes", ["thermal_limitations_mw", "dg_breakdown_mw", "dg_maintenance_mw", "dg_fuel_out_plants", "dg_fuel_out_mw", "fuel_out_total_mw", "solar_mwh", "solar_peak_mw"]],
    ["Events", ["grid_collapse"]],
  ];
  const BOOL = new Set(["prev_day_affected_all_day", "grid_collapse"]);
  const statusOf = n => n.hr ? n.hr.status : n.r ? "review" : "passed";
  const isHard = f => HARD.some(h => f.startsWith(h));
  const DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const dateOf = d => new Date(d + "T12:00:00");
  const longDate = d => { const x = dateOf(d); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]} ${x.getFullYear()}`; };
  const shortDate = d => { const x = dateOf(d); return `${DOW[x.getDay()].slice(0, 3)} ${x.getDate()} ${MON[x.getMonth()].slice(0, 3)} ${x.getFullYear()}`; };
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString("en-US") : v; };
  const fmt = (f, v) => v === undefined ? "—" : v === "True" ? "Yes" : v === "False" ? "No" : /_mw$|_mwh$|plants$/.test(f) ? num(v) : v;
  const unit = f => /_mwh$/.test(f) ? "MWh" : /_mw$/.test(f) ? "MW" : "";

  // ---------- Accent-insensitive search; folding keeps string length so indexes map back ----------
  const fold = s => { let o = ""; for (let i = 0; i < s.length; i++) { const ch = s[i]; let f = ch.normalize("NFD")[0].toLowerCase(); if (f.length !== 1) f = ch; o += f; } return o; };
  NOTES.forEach(n => { n._x = fold(n.x); n._t = fold(n.t); });
  const terms = q => { const out = []; q.replace(/"([^"]+)"|(\S+)/g, (_, a, b) => { const t = fold((a || b).trim()); if (t) out.push(t); }); return out; };
  const hits = (folded, ts) => { const r = []; ts.forEach(t => { let i = folded.indexOf(t); while (i !== -1) { r.push([i, i + t.length]); i = folded.indexOf(t, i + t.length); } }); return r; };

  // ---------- State ----------
  const S = { q: "", from: "", to: "", src: "", model: "", status: "", desc: true, year: "", sel: null };
  const opened = new Set();  // notes the reader chose to review although no check flagged them
  try { Object.assign(S, JSON.parse(sessionStorage.getItem("cuba-grid-filters") || "{}"), { sel: null }); } catch (e) {}
  let view = [];

  const years = [...new Set(NOTES.map(n => n.d.slice(0, 4)))].sort();
  $("years").innerHTML = ['<button type="button" data-y="">All</button>', ...years.map(y => `<button type="button" data-y="${y}">${y}</button>`)].join("");

  function syncControls() {
    $("q").value = S.q; $("from").value = S.from; $("to").value = S.to; $("src").value = S.src; $("model").value = S.model;
    $("status").value = S.status; $("sort").textContent = S.desc ? "Newest first" : "Oldest first";
    $("years").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.y === S.year && (S.year || (!S.from && !S.to)))));
  }

  function filter() {
    const ts = terms(S.q);
    view = NOTES.filter(n =>
      (!S.from || n.d >= S.from) && (!S.to || n.d <= S.to) && (!S.src || n.s === S.src) &&
      (!S.model || n.m === S.model) && (!S.status || statusOf(n) === S.status) &&
      ts.every(t => n._x.includes(t) || n._t.includes(t) || n.d.includes(t)));
    if (S.desc) view.reverse();
    try { sessionStorage.setItem("cuba-grid-filters", JSON.stringify({ ...S, sel: null })); } catch (e) {}
    renderList(ts);
    if (!view.some(n => n.id === S.sel)) select(view[0] ? view[0].id : null, { keepView: true });
    else renderDetail();
  }

  function snippet(n, ts) {
    const h = hits(n._x, ts).sort((a, b) => a[0] - b[0])[0];
    if (!h) return "";
    const a = Math.max(0, h[0] - 50), b = Math.min(n.x.length, h[1] + 80);
    return (a > 0 ? "…" : "") + mark(n.x.slice(a, b), hits(n._x.slice(a, b), ts), []) + (b < n.x.length ? "…" : "");
  }

  function renderList(ts) {
    const review = view.filter(n => n.r).length, done = view.filter(n => n.hr).length;
    $("summary").innerHTML = `<span><b>${view.length.toLocaleString("en-US")}</b> notes · <b>${review}</b> need review${done ? ` · <b>${done}</b> reviewed` : ""}</span><span class="mono">↑↓ to move</span>`;
    if (!view.length) { $("list").innerHTML = '<li class="empty">No notes match. Widen the dates or clear the search.</li>'; return; }
    $("list").innerHTML = view.map(n => {
      const v = n.v.forecast_affectation_mw;
      return `<li><button type="button" data-id="${n.id}" aria-current="${n.id === S.sel}">
        <span class="li-date">${n.r ? '<i class="dot" title="Needs review"></i>' : ""}${shortDate(n.d)}</span>
        <span class="li-val">${v !== undefined ? num(v) + ' <small>MW tonight</small>' : '<small>no forecast</small>'}</span>
        <span class="li-meta"><span>${n.s === "granma" ? "Granma" : "Cubadebate"}</span>${n.hr ? `<span>· ${n.hr.status === "validated" ? "✓ validated" : "✕ rejected"}</span>` : ""}${n.c ? "" : "<span>· extra note that day</span>"}${n.f.length ? `<span>· ${n.f.length} flag${n.f.length > 1 ? "s" : ""}</span>` : ""}</span>
        ${ts.length ? `<span class="li-snip">${snippet(n, ts)}</span>` : ""}
      </button></li>`;
    }).join("");
  }

  // ---------- Detail ----------
  function findQuote(text, quote) {
    let i = text.indexOf(quote);
    if (i !== -1) return [i, i + quote.length];
    const pat = quote.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
    try { const m = new RegExp(pat, "i").exec(text); if (m) return [m.index, m.index + m[0].length]; } catch (e) {}
    return null;
  }

  // Wrap text segments: quote ranges carry the fields they support; search ranges get highlighted.
  function mark(text, searchRanges, quoteRanges) {
    const cuts = new Set([0, text.length]);
    [...searchRanges, ...quoteRanges].forEach(r => { cuts.add(r[0]); cuts.add(r[1]); });
    const pts = [...cuts].sort((a, b) => a - b);
    let out = "";
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k], b = pts[k + 1], seg = esc(text.slice(a, b));
      const fields = quoteRanges.filter(r => r[0] <= a && r[1] >= b).flatMap(r => r[2]);
      const hit = searchRanges.some(r => r[0] <= a && r[1] >= b);
      const cls = [fields.length ? "q" : "", hit ? "hit" : ""].filter(Boolean).join(" ");
      out += cls ? `<span class="${cls}"${fields.length ? ` data-f="${fields.join(" ")}" title="${esc([...new Set(fields)].map(f => L[f]).join(", "))}"` : ""}>${seg}</span>` : seg;
    }
    return out;
  }

  function fieldFlags(n, f) { return n.f.filter(x => x.split(":")[1] === f); }

  function metric(n, f, located, cls = "m") {
    const v = n.v[f], fl = fieldFlags(n, f).filter(isHard);
    const attrs = located.has(f) ? ` data-f="${f}" role="button" tabindex="0" title="Show where this comes from in the note"` : "";
    return `<span class="${cls}${v === undefined ? " na" : ""}${fl.length ? " flagged" : ""}"${attrs}><span class="mk">${L[f]}</span><span class="mv">${fmt(f, v)}${v !== undefined && unit(f) ? " " + unit(f) : ""}</span></span>`;
  }

  function hero(n, f, sub, located) {
    const v = n.v[f], fl = fieldFlags(n, f).filter(isHard);
    const attrs = located.has(f) ? ` data-f="${f}" role="button" tabindex="0" title="Show where this comes from in the note"` : "";
    return `<span class="hero${v === undefined ? " na" : ""}${fl.length ? " flagged" : ""}"${attrs}><b>${v === undefined ? "Not stated" : num(v) + "<small>MW</small>"}</b><span>${sub}</span></span>`;
  }

  function renderDetail() {
    const n = byId.get(S.sel), box = $("detail");
    if (!n) { box.innerHTML = '<div class="wrap"><p class="empty">No note selected.</p></div>'; return; }
    const ts = terms(S.q);
    const quoteRanges = [], located = new Set();
    Object.entries(n.q).forEach(([f, q]) => { const r = findQuote(n.x, q); if (r) { quoteRanges.push([r[0], r[1], [f]]); located.add(f); } });
    const idx = view.findIndex(x => x.id === n.id);
    const v = n.v;
    const at = (f, pre) => v[f] !== undefined ? `${pre} ${v[f]}` : "";
    const hard = n.f.filter(isHard), soft = n.f.filter(f => !isHard(f));
    const flagLine = f => { const [k, d] = f.split(":"); return `<li><span class="badge ${isHard(f) ? "bad" : "warn"}">${isHard(f) ? "review" : "note"}</span><span>${esc(FLAG[k] || k)}${d ? ` — <span class="mono">${esc(L[d] || d)}</span>` : ""}</span></li>`; };
    const causes = ["thermal_limitations_mw", "dg_breakdown_mw", "dg_maintenance_mw", "dg_fuel_out_mw", "dg_fuel_out_plants", "fuel_out_total_mw", "solar_mwh", "solar_peak_mw"];
    const textbox = `<div class="textbox">
        <div class="texthead"><span class="label">Note text</span>
          <span class="legend"><span><i style="background:transparent;border-bottom:2px solid var(--accent)"></i>source of a figure (click a figure to find it)</span>${ts.length ? '<span><i style="background:var(--hit)"></i>search match</span>' : ""}</span>
        </div>
        <div class="note" id="note">${mark(n.x, hits(n._x, ts), quoteRanges)}</div>
      </div>`;

    box.innerHTML = `<div class="wrap">
      <div class="dhead">
        <div class="dnav">
          <button type="button" class="back" id="back">← List</button>
          <button type="button" id="prev" ${idx <= 0 ? "disabled" : ""}>← ${S.desc ? "Newer" : "Older"}</button>
          <button type="button" id="next" ${idx < 0 || idx >= view.length - 1 ? "disabled" : ""}>${S.desc ? "Older" : "Newer"} →</button>
          <span class="label">${idx >= 0 ? `${idx + 1} of ${view.length}` : ""}</span>
        </div>
        <h1>${longDate(n.d)}</h1>
        ${n.t ? `<div class="dtitle">${esc(n.t)}</div>` : ""}
        <div class="badges">
          ${n.r ? '<span class="badge bad">Needs review</span>' : '<span class="badge">Passed checks</span>'}
          ${v.grid_collapse === "True" ? '<span class="badge bad">Grid collapse</span>' : ""}
          <span class="badge">${n.s === "granma" ? "Granma" : "Cubadebate"}</span>
          <span class="badge">Read by ${n.m === "sonnet" ? "Sonnet 5.5" : n.m === "haiku" ? "Haiku 5.5" : esc(n.m)}</span>
          ${n.c ? "" : '<span class="badge warn">Extra note that day, not used in daily.csv</span>'}
          ${n.hr ? `<span class="badge ${n.hr.status === "validated" ? "" : "bad"}">${n.hr.status === "validated" ? "✓ Validated" : "✕ Rejected"} by ${esc(n.hr.reviewer || "a reviewer")}</span>` : ""}
          ${EDITABLE && !formShown(n) ? '<button type="button" class="btn" id="open-review" style="padding:5px 10px;font-size:13px">Review this note</button>' : ""}
        </div>
        <div class="links"><a href="${esc(n.u)}" target="_blank" rel="noopener">Original page</a><a href="https://web.archive.org/web/${esc(n.u)}" target="_blank" rel="noopener">Archive copy</a></div>
      </div>

      <div class="kpis">
        <div class="frame"><span class="when">Yesterday</span>
          ${hero(n, "prev_day_max_affectation_mw", ["Max shortfall", at("prev_day_max_affectation_time", "at")].filter(Boolean).join(" "), located)}
          <div class="metrics">${["prev_day_max_affectation_time", "prev_day_affected_all_day", "prev_day_restored_time"].map(f => metric(n, f, located)).join("")}</div>
        </div>
        <div class="frame"><span class="when">This morning</span>
          ${hero(n, "snapshot_affectation_mw", ["Cut", at("snapshot_time", "at")].filter(Boolean).join(" "), located)}
          <div class="metrics">${["snapshot_time", "snapshot_availability_mw", "snapshot_demand_mw", "midday_forecast_affectation_mw"].map(f => metric(n, f, located)).join("")}</div>
        </div>
        <div class="frame"><span class="when">Tonight's peak</span>
          ${hero(n, "forecast_affectation_mw", "Forecast cut", located)}
          <div class="metrics">${["forecast_availability_mw", "forecast_demand_mw", "forecast_deficit_mw", "forecast_reserve_mw"].map(f => metric(n, f, located)).join("")}</div>
        </div>
      </div>

      <div class="causes">${causes.map(f => { const x = v[f], fl = fieldFlags(n, f).filter(isHard).length;
        return `<span class="c${x === undefined ? " na" : ""}${fl ? " flagged" : ""}"${located.has(f) ? ` data-f="${f}" role="button" tabindex="0" title="Show where this comes from in the note"` : ""}><b>${fmt(f, x)}${x !== undefined && unit(f) ? `<small>${unit(f)}</small>` : ""}</b><span>${L[f]}</span></span>`; }).join("")}</div>

      ${n.ub || n.um || n.inc ? `<div class="units">
        ${n.ub ? `<div><span class="label">Units broken down</span><p>${esc(n.ub)}</p></div>` : ""}
        ${n.um ? `<div><span class="label">Units in maintenance</span><p>${esc(n.um)}</p></div>` : ""}
        ${n.inc ? `<div><span class="label">Expected to come back tonight</span><p class="mono">${num(n.inc)} MW</p></div>` : ""}
      </div>` : ""}

      ${n.f.length ? `<div class="flags"><span class="label">Checks</span><ul>${[...hard, ...soft].map(flagLine).join("")}</ul></div>` : ""}
      ${n.k ? `<div class="remark"><span class="label">Model's remark</span>${esc(n.k)}</div>` : ""}

      ${!EDITABLE && n.r ? '<p class="hint">To review this note, run <code>uv run cuba-grid serve</code> in the Cuba_oil folder and open the page it prints. This copy is read-only.</p>' : ""}

      ${formShown(n) ? `<div class="desk">${reviewForm(n, located)}${textbox}</div>` : textbox}
    </div>`;

    const bind = (id, fn) => { const e = $(id); if (e) e.addEventListener("click", fn); };
    bind("back", () => { $("app").dataset.view = "list"; focusSelected(); });
    bind("prev", () => step(-1));
    bind("next", () => step(1));
    bind("open-review", () => { opened.add(n.id); renderDetail(); });
    bind("rv-reject", () => save(n, "rejected"));
    bind("rv-undo", () => undo(n));
    bind("rv-cancel", () => { opened.delete(n.id); renderDetail(); });
    const form = $("rv");
    box.querySelector(".wrap").classList.toggle("desk-on", !!form);
    if (form) {
      form.addEventListener("submit", e => { e.preventDefault(); save(n, "validated", e.submitter && e.submitter.dataset.act === "next"); });
      // Enter in a figure box must not validate the whole note by accident.
      form.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") e.preventDefault(); });
      form.addEventListener("input", paintDiffs);
      form.addEventListener("change", paintDiffs);
      $("rv-only").addEventListener("change", e => form.querySelectorAll("tr[data-row]").forEach(tr => { tr.hidden = e.target.checked && !tr.classList.contains("disputed") && !tr.classList.contains("err"); }));
      paintDiffs();
    }
  }

  // ---------- Review form ----------
  const formShown = n => EDITABLE && (n.r || !!n.hr || opened.has(n.id));
  const norm = v => v === undefined || v === null || v === "" ? "" : v === true || v === "True" ? "true" : v === false || v === "False" ? "false" : String(v);
  const startValue = (n, f) => n.hr && n.hr.status === "validated" ? n.hr.payload[f] : n.v[f];
  const readingsOf = (n, f) => [n.alt.haiku[f], n.alt.sonnet ? n.alt.sonnet[f] : undefined, n.alt.patterns[f]];

  function disputed(n, f) {
    const flagged = n.f.some(x => isHard(x) && (x.split(":")[1] === f || (FLAG_FIELDS[x.split(":")[0]] || []).includes(f)));
    const rs = readingsOf(n, f).map(norm).filter(Boolean), cur = norm(startValue(n, f));
    return flagged || new Set(cur ? [...rs, cur] : rs).size > 1 || (rs.length > 0 && !cur);
  }

  function reviewForm(n, located) {
    const hasS = !!n.alt.sonnet;
    const rd = (f, v) => v === undefined || v === null ? '<span class="muted">—</span>'
      : `<button type="button" class="rd" data-set="${f}" data-v="${esc(norm(v))}" title="Use this reading">${esc(fmt(f, v === true ? "True" : v === false ? "False" : String(v)))}</button>`;
    const input = f => {
      const cur = norm(startValue(n, f));
      if (BOOL.has(f)) return `<select id="rv-${f}" data-in="${f}" aria-label="${L[f]}"><option value="">—</option><option value="true"${cur === "true" ? " selected" : ""}>Yes</option><option value="false"${cur === "false" ? " selected" : ""}>No</option></select>`;
      const time = f.endsWith("_time");
      return `<input id="rv-${f}" data-in="${f}" aria-label="${L[f]}" value="${esc(cur)}" inputmode="${time ? "text" : "numeric"}" placeholder="${time ? "hh:mm" : "not stated"}" autocomplete="off">`;
    };
    const anyDisputed = GROUPS.some(([, fs]) => fs.some(f => disputed(n, f)));
    const rows = GROUPS.map(([g, fs]) => `<tr class="grp"><td colspan="${hasS ? 5 : 4}">${g}</td></tr>` + fs.map(f => {
      const d = disputed(n, f);
      return `<tr data-row="${f}" class="${d ? "disputed" : ""}"${anyDisputed && !d ? " hidden" : ""}>
        <td><button type="button" class="fl${located.has(f) ? "" : " noq"}"${located.has(f) ? ` data-f="${f}" title="Show the sentence in the note"` : ""}>${L[f]}${unit(f) ? ` <span class="muted mono" style="font-size:11px">${unit(f)}</span>` : ""}</button></td>
        <td>${rd(f, n.alt.haiku[f])}</td>${hasS ? `<td>${rd(f, n.alt.sonnet[f])}</td>` : ""}<td>${rd(f, n.alt.patterns[f])}</td>
        <td>${input(f)}</td></tr>`;
    }).join("")).join("");
    let who = ""; try { who = localStorage.getItem("cuba-grid-reviewer") || ""; } catch (e) {}
    const h = n.hr;
    return `<form class="rv" id="rv" novalidate>
      <div class="rv-head"><h2>Review</h2>
        <label class="check"><input type="checkbox" id="rv-only"${anyDisputed ? " checked" : ""}${anyDisputed ? "" : " disabled"}> Disputed figures only</label>
      </div>
      ${h ? `<p class="rv-done"><span class="badge ${h.status === "validated" ? "" : "bad"}">${h.status}</span><span>by ${esc(h.reviewer || "—")} on ${esc(h.reviewed_at)} UTC. Saving again replaces this review.</span></p>`
          : `<p class="rv-help">Rows marked in red are where the readings disagree or a check failed. Click a reading to use it, or type your own. Click a figure's name to see its sentence in the note. Leave a box empty if the note does not state the figure.</p>`}
      <div class="rvt-wrap"><table class="rvt">
        <thead><tr><th>Figure</th><th>Haiku</th>${hasS ? "<th>Sonnet</th>" : ""}<th>Patterns</th><th>Your reading</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="rv-fields">
        <label class="field"><span class="label">How you read the note</span><textarea id="rv-int" placeholder="E.g. the 1,250 MW is the daytime maximum; the night maximum is 1,410 MW at 21:20.">${esc(h ? h.interpretation || "" : "")}</textarea></label>
        <label class="field"><span class="label">Your initials</span><input id="rv-who" value="${esc(h ? h.reviewer || who : who)}" maxlength="40" autocomplete="off"></label>
      </div>
      <div class="rv-actions">
        <button type="submit" class="btn primary" data-act="next">Validate and open next</button>
        <button type="submit" class="btn" data-act="stay">Validate</button>
        <button type="button" class="btn danger" id="rv-reject">Reject note</button>
        ${h ? '<button type="button" class="btn" id="rv-undo">Undo review</button>' : !n.r ? '<button type="button" class="btn" id="rv-cancel">Close</button>' : ""}
      </div>
      <p class="rv-msg" id="rv-msg" role="status"></p>
    </form>`;
  }

  function readInput(f, raw) {
    raw = raw.trim();
    if (!raw) return { v: null };
    if (BOOL.has(f)) return { v: raw === "true" };
    if (f.endsWith("_time")) {
      const m = /^(\d{1,2})[:.hH](\d{2})$/.exec(raw);
      if (!m || +m[1] > 23 || +m[2] > 59) return { err: "a 24-hour time such as 19:40" };
      return { v: m[1].padStart(2, "0") + ":" + m[2] };
    }
    if (/^\d+$/.test(raw)) return { v: +raw };
    if (/^\d{1,3}([ ,. ]\d{3})+$/.test(raw)) return { v: +raw.replace(/[ ,. ]/g, "") };
    return { err: "a whole number" };
  }

  function paintDiffs() {
    const form = $("rv"); if (!form) return;
    form.querySelectorAll(".rd").forEach(b => {
      const el = $("rv-" + b.dataset.set), r = readInput(b.dataset.set, el.value);
      b.classList.toggle("diff", r.err !== undefined || norm(r.v) !== b.dataset.v);
    });
  }

  function replaceNote(nn) {
    nn._x = fold(nn.x); nn._t = fold(nn.t);
    const i = NOTES.findIndex(x => x.id === nn.id);
    if (i !== -1) NOTES[i] = nn;
    byId.set(nn.id, nn);
  }

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 4000);
  }

  async function send(method, url, body) {
    const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `The server answered ${r.status}`);
    return j.note;
  }

  function after(n, nn, msg, goNext) {
    // Pick where to go before the list changes under us.
    const i = view.findIndex(x => x.id === n.id);
    const nextFlagged = goNext ? view.slice(i + 1).find(x => x.r) : null;
    replaceNote(nn);
    opened.delete(n.id);
    S.sel = nextFlagged ? nextFlagged.id : n.id;
    filter();
    select(view.some(x => x.id === S.sel) ? S.sel : (view[0] || {}).id || null, { keepView: true });
    focusSelected();
    toast(msg);
  }

  async function save(n, status, goNext) {
    const form = $("rv"), msg = $("rv-msg"), values = {}, bad = [];
    form.querySelectorAll("tr.err").forEach(tr => tr.classList.remove("err"));
    form.querySelectorAll("[data-in]").forEach(el => {
      const f = el.dataset.in, r = readInput(f, el.value);
      if (r.err) { bad.push(`${L[f]}: ${r.err}`); const tr = el.closest("tr"); tr.classList.add("err"); tr.hidden = false; }
      else values[f] = r.v;
    });
    const interpretation = $("rv-int").value.trim(), reviewer = $("rv-who").value.trim();
    msg.className = "rv-msg err";
    if (bad.length) { msg.textContent = "Fix these figures: " + bad.join("; ") + "."; return; }
    if (status === "rejected" && !interpretation) { msg.textContent = "Write in “How you read the note” why this note is rejected."; $("rv-int").focus(); return; }
    try { localStorage.setItem("cuba-grid-reviewer", reviewer); } catch (e) {}
    form.querySelectorAll("button").forEach(b => { b.disabled = true; });
    msg.className = "rv-msg"; msg.textContent = "Saving and rebuilding the dataset…";
    try {
      const nn = await send("POST", "/api/review", { id: n.id, status, values, interpretation, reviewer });
      after(n, nn, status === "validated" ? `${shortDate(n.d)} validated and added to daily.csv.` : `${shortDate(n.d)} rejected and left out of daily.csv.`, goNext);
    } catch (e) {
      form.querySelectorAll("button").forEach(b => { b.disabled = false; });
      msg.className = "rv-msg err"; msg.textContent = `Not saved: ${e.message}. Is cuba-grid serve still running?`;
    }
  }

  async function undo(n) {
    const msg = $("rv-msg");
    try {
      const nn = await send("DELETE", "/api/review/" + n.id);
      after(n, nn, `Review of ${shortDate(n.d)} removed; the models' reading applies again.`, false);
    } catch (e) { msg.className = "rv-msg err"; msg.textContent = `Not removed: ${e.message}.`; }
  }

  function showField(f) {
    const note = $("note"); if (!note) return;
    note.querySelectorAll(".q.on").forEach(e => e.classList.remove("on"));
    document.querySelectorAll(".on-field").forEach(e => e.classList.remove("on-field"));
    const segs = [...note.querySelectorAll(".q")].filter(e => e.dataset.f.split(" ").includes(f));
    segs.forEach(e => { e.classList.add("on"); e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash"); });
    if (segs[0]) segs[0].scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    document.querySelectorAll(`[data-f="${f}"]:not(.q)`).forEach(e => e.classList.add("on-field"));
  }

  function select(id, opts = {}) {
    S.sel = id;
    try { history.replaceState(null, "", id ? "#n" + id : location.pathname); } catch (e) {}
    $("list").querySelectorAll("button[aria-current]").forEach(b => b.setAttribute("aria-current", String(+b.dataset.id === id)));
    renderDetail();
    $("detail").scrollTop = 0;
    if (!opts.keepView && id) $("app").dataset.view = "detail";
  }

  const n_has = f => !!document.querySelector(`#note .q[data-f~="${f}"]`);

  function focusSelected() { const b = $("list").querySelector('button[aria-current="true"]'); if (b) b.scrollIntoView({ block: "nearest" }); }
  function step(d) { const i = view.findIndex(n => n.id === S.sel), j = i + d; if (j >= 0 && j < view.length) { select(view[j].id, { keepView: true }); focusSelected(); } }

  // ---------- Events ----------
  let timer;
  $("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { S.q = e.target.value; filter(); }, 150); });
  $("from").addEventListener("change", e => { S.from = e.target.value; S.year = ""; syncControls(); filter(); });
  $("to").addEventListener("change", e => { S.to = e.target.value; S.year = ""; syncControls(); filter(); });
  $("src").addEventListener("change", e => { S.src = e.target.value; filter(); });
  $("model").addEventListener("change", e => { S.model = e.target.value; filter(); });
  $("status").addEventListener("change", e => { S.status = e.target.value; filter(); });
  $("sort").addEventListener("click", () => { S.desc = !S.desc; syncControls(); filter(); });
  $("years").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    S.year = b.dataset.y; S.from = S.year ? S.year + "-01-01" : ""; S.to = S.year ? S.year + "-12-31" : "";
    syncControls(); filter();
  });
  $("list").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) select(+b.dataset.id); });
  $("detail").addEventListener("click", e => {
    const rd = e.target.closest(".rd");
    if (rd) { const el = $("rv-" + rd.dataset.set); el.value = rd.dataset.v; paintDiffs(); if (n_has(rd.dataset.set)) showField(rd.dataset.set); return; }
    const t = e.target.closest("[data-f]"); if (!t) return;
    showField(t.classList.contains("q") ? t.dataset.f.split(" ")[0] : t.dataset.f);
  });
  $("detail").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-f][role=button]")) { e.preventDefault(); showField(e.target.dataset.f); } });
  document.addEventListener("keydown", e => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); return; }
    if (e.key === "Escape" && document.activeElement === $("q")) { $("q").blur(); return; }
    if (typing) return;
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); step(1); }
    if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); step(-1); }
  });

  // ---------- Start ----------
  syncControls();
  const fromHash = /^#n(\d+)$/.exec(location.hash);
  filter();
  if (fromHash && byId.has(+fromHash[1])) {
    if (!view.some(n => n.id === +fromHash[1])) { Object.assign(S, { q: "", from: "", to: "", src: "", model: "", status: "", year: "" }); syncControls(); filter(); }
    select(+fromHash[1], { keepView: true }); focusSelected();
  }
})();
</script>
</body>
</html>
